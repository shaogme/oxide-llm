[workspace]
members = [
    "crates/oxide-llm",
    "crates/oxide-llm-core",
    "crates/oxide-llm-proto",
    "crates/oxide-llm-transport",
    "crates/oxide-llm-macros",
    "crates/oxide-llm-executor",
    "examples/agent",
    "e2e/runner-e2e",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Shao G. <shaogme@gmail.com>"]
repository = "https://github.com/shaogme/oxide-llm"
description = ""
readme = "README.md"
homepage = "https://github.com/shaogme/oxide-llm"
documentation = "https://docs.rs/oxide-llm"
keywords = []
categories = []

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]

# Internal Crates
oxide-llm = { path = "crates/oxide-llm" }
oxide-llm-core = { path = "crates/oxide-llm-core" }
oxide-llm-proto = { path = "crates/oxide-llm-proto" }
oxide-llm-transport = { path = "crates/oxide-llm-transport" }
oxide-llm-macros = { path = "crates/oxide-llm-macros" }
oxide-llm-executor = { path = "crates/oxide-llm-executor" }

# External Crates
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
diagweave = "0.5.2"
ref_str = { version = "0.2", features = ["serde"] }

futures = "0.3.31"
bytes = "1.11.1"
trait-morph = "0.1.1"
